name: Validate public demo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic data
        run: python scripts/validate_public_data.py
      - name: Check JavaScript syntax
        run: node --check app.js
